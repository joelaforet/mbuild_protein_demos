[workspace]
name = "mbuild_protein_demos"
description = "Tutorials: prepare and covalently modify proteins with mBuild, hand off to GMSO / OpenFF / RDKit"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
# openff-pablo requires python >= 3.12
python = ">=3.12,<3.13"
# mBuild runtime dependencies (mBuild itself installs via `pixi run setup`)
ele = "*"
numpy = ">=2.0,<2.6"
packmol = ">=20.15"
cgsmiles = ">=1.0.2"
gmso = ">=0.16.2"
garnett = "*"
numba = "*"
parmed = ">=3.4.3"
pycifrw = "*"
rdkit = ">=2021"
scipy = "*"
networkx = "*"
treelib = "*"
hoomd = ">=4"
# the generic PDB loader mb.load uses, for the comparison in evidence/
mdtraj = ">=1.11.1,<2"
# simulation + preparation
openmm = "*"
pdbfixer = "*"
# OpenFF handoff and parameterization (pablo installs via `pixi run setup`)
openff-toolkit-base = ">=0.17.1"
openff-interchange = ">=0.4"
openff-forcefields = "*"
openff-amber-ff-ports = "*"
openff-nagl = "*"
openff-nagl-models = "*"
gemmi = "*"
rustworkx = "*"
pyxdg = "*"
# notebooks
jupyterlab = "*"
ipykernel = "*"
# 4.0.1 bundles a 3.1.5 JS extension, rejected by its 4.0 Python widgets.
nglview = "==3.1.4"
ipywidgets = ">=8"
pip = "*"
# NGLView 3.1.4 imports pkg_resources, removed in setuptools 81.
setuptools = "<81"

[tasks]
# Installs mBuild and openff-pablo, then caches the two residue
# templates the semaglutide notebook needs. Run once after
# `pixi install`. Needs network; after it succeeds the demo runs offline.
#
# The contribution is a stack of branches on the fork, each one a review
# layer on top of the previous. feat/biopolymers-docs is the tip, so it
# contains every layer; installing from it gets the whole thing. The
# branches only have to exist on the fork — whether their pull requests
# are open, draft, or not yet opened makes no difference to pip.
#
# To pin the demo to an exact commit, for a talk or a bisect, replace the
# branch with a SHA:
#   "git+https://github.com/joelaforet/mbuild.git@ffbf083c"
setup = """pip install --no-deps \
  "git+https://github.com/joelaforet/mbuild.git@feat/biopolymers-docs" \
  "git+https://github.com/openforcefield/openff-pablo.git@v0.2.2" && \
python -c "
from openff.pablo import STD_CCD_CACHE
STD_CCD_CACHE.auto_download = True
STD_CCD_CACHE.get_from_ccd('KUT'); STD_CCD_CACHE.get_from_ccd('AIB')
from mbuild.biopolymers import CCDLibrary
library = CCDLibrary(download=True); library['KUT']; library['AIB']
print('residue templates cached')"
"""
# Installs mbuild from a local checkout, so module edits apply at once.
dev = 'pip install --no-deps -e ../mbuild'
# The claim, without a notebook: builds the modified structure and
# compares it against the workshop's own file.
prove = "python scripts/verify_semaglutide.py"
# Downloads the 21 MB workshop file and rebuilds the committed assets.
# Only needed to regenerate them; the notebooks never read it.
fetch = "python scripts/fetch_reference.py"
assets = "python scripts/build_assets.py"
# Regenerates the notebooks from scripts/make_notebooks.py.
notebooks = "python scripts/make_notebooks.py"
# Opens the tutorials.
lab = "jupyter lab 01_load_and_export.ipynb 02_semaglutide.ipynb"
# Executes the notebooks headless and writes the outputs back.
# store_widget_state=False keeps NGLView's widget state out of the
# files: it holds the whole structure as text and would add several
# hundred kB of diff per run.
verify = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 --ExecutePreprocessor.store_widget_state=False 01_load_and_export.ipynb 02_semaglutide.ipynb 03_extensions.ipynb"
charges = "python verify_charges.py"
# Regenerates and executes the evidence notebooks in evidence/. Each one
# backs a claim made in the pull request descriptions. The corpus notebook
# downloads about 10 MB from openff-pablo's repository the first time.
evidence = """python scripts/make_evidence.py && \
cd evidence && jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 \
loader_bond_orders.ipynb pablo_corpus.ipynb pdb_round_trip.ipynb multi_residue_fragment.ipynb deprotonate_then_attach.ipynb glycan_from_pdb.ipynb"""
